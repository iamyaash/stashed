name: Build and Deploy Hugo site

on:
  push:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # NATIVE METHOD: Download your exact Hugo version for ARM64 architecture
      - name: Install Specific Hugo Version
        run: |
          # 1. Download the native tar.gz package for ARM64 from GitHub's release servers
          wget https://github.com/gohugoio/hugo/releases/download/v0.147.5/hugo_extended_0.147.5_linux-arm64.tar.gz
          
          # 2. Extract just the 'hugo' executable binary
          tar -xzf hugo_extended_0.147.5_linux-arm64.tar.gz hugo
          
          # 3. Move it to a system path inside the container so it can be executed globally
          mv hugo /usr/local/bin/hugo
          
          # 4. Confirm the version matches
          hugo version

      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \
            --minify

      # Step 5: Native bash rsync deployment using your Forgejo Secrets
      - name: Deploy to Google Cloud's free-vm
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_IP: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          # 1. Install SSH and Rsync utilities inside the runner container
          apt-get update && apt-get install -y openssh-client rsync

          # 2. Set up the private SSH key safely using absolute $HOME variable
          mkdir -p $HOME/.ssh
          echo "$SSH_KEY" > $HOME/.ssh/cloud-ssh-login
          chmod 600 $HOME/.ssh/cloud-ssh-login

          # 3. Disable strict host key checking so it connects automatically
          echo -e "Host *\n\tStrictHostKeyChecking no\n\tIdentityFile $HOME/.ssh/cloud-ssh-login\n" > $HOME/.ssh/config

          # 4. Run the exact same production rsync synchronization natively
          rsync -rlgoDIVz --delete public/ ${VM_USER}@${VM_IP}:/var/www/html/stashed/