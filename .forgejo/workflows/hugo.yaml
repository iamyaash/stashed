name: Build and Deploy Hugo site

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: tiny-machine
    container:
      image: docker.io/hugomods/hugo:0.147.5
    defaults:
      run:
        shell: sh

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Node.js dependencies
        run: |
          if [ -f package.json ]; then
            apk add --no-cache nodejs npm
            if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
              npm ci
            else
              npm install
            fi
          fi

      - name: Build Static Files
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify

      - name: Save Site Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: static-site-files
          path: public/

  deploy:
    runs-on: tiny-machine
    needs: build
    container:
      image: docker.io/library/node:lts
    defaults:
      run:
        shell: bash

    steps:
      - name: Download Site Artifacts
        uses: actions/download-artifact@v3
        with:
          name: static-site-files
          path: public/

      - name: Install rclone and SSH client
        run: |
          apt-get update
          apt-get install -y rclone openssh-client ca-certificates

      - name: Configure rclone for SFTP
        run: |
          mkdir -p ~/.config/rclone ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.FREE_VM_SSH }}" > ~/.ssh/free-vm
          chmod 600 ~/.ssh/free-vm

          PORT="${{ secrets.FREE_VM_PORT }}"
          if [ -z "$PORT" ]; then
            PORT=22
          fi

          cat > ~/.config/rclone/rclone.conf <<EOF
          [freevm]
          type = sftp
          host = ${{ secrets.FREE_VM_HOST }}
          user = ${{ secrets.FREE_VM_USER }}
          port = $PORT
          key_file = /root/.ssh/free-vm
          shell_type = unix
          md5sum_command = none
          sha1sum_command = none
          EOF

          chmod 600 ~/.config/rclone/rclone.conf

      - name: Verify rclone connection
        run: |
          rclone lsf freevm:/var/www/html/ || true

      - name: Deploy site with rclone
        run: |
          rclone sync public/ freevm:/var/www/html/stashed/ \
            --delete-during \
            --fast-list \
            --links