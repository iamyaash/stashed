name: Build and Deploy Hugo site

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: low-compute
    container:
      image: docker.io/hugomods/hugo:0.147.5 # Verified ARM64 container image containing Extended Hugo
    defaults:
      run:
        shell: sh

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Install Node dependencies using standard POSIX sh syntax
      - name: Install Node.js dependencies
        run: |
          if [ -f package.json ]; then
            apk add --no-cache nodejs npm
            if [ -f package-lock.json ] || [ -f npm-s
            
            hrinkwrap.json ]; then
            
              npm ci
            else
              npm install
            fi
          fi

      - name: Build Static Files
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo --gc --minify

      # Save the 'public' folder using the Forgejo-compatible v3 action
      - name: Save Site Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: static-site-files
          path: public/
  
  deploy:
    runs-on: low-compute
    needs: build
    container:
      image: docker.io/library/node:lts
    defaults:
      run:
        shell: bash

    steps:
      - name: Download Site Artifacts
        uses: actions/download-artifact@v3
        with:
          name: static-site-files
          path: public/

      - name: Verify downloaded files
        run: |
          ls -la
          ls -la public

      - name: Install rsync and ssh client
        run: |
          apt-get update
          apt-get install -y rsync openssh-client

      # - name: Prepare SSH key
      #   run: |
      #     mkdir -p ~/.ssh
      #     printf '%s\n' "${{ secrets.FREE_VM_SSH_KEY }}" > ~/.ssh/cloud-ssh-login
      #     chmod 600 ~/.ssh/cloud-ssh-login

      #     PORT="${{ secrets.FREE_VM_PORT }}"
      #     if [ -z "$PORT" ]; then
      #       PORT=22
      #     fi

      - name: Prepare SSH key
        env:
          VM_HOST: ${{ secrets.FREE_VM_HOST }}
          VM_PORT: ${{ secrets.FREE_VM_PORT }}
          VM_KEY: ${{ secrets.FREE_VM_SSH }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Strip Windows \r line breaks and write key as 'free-vm'
          printf '%s\n' "$VM_KEY" | tr -d '\r' > ~/.ssh/free-vm
          chmod 600 ~/.ssh/free-vm

          PORT="${VM_PORT:-22}"

          touch ~/.ssh/known_hosts
          ssh-keygen -R "[$VM_HOST]:$PORT" || true
          ssh-keyscan -H -p "$PORT" "$VM_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          VM_USER: ${{ secrets.FREE_VM_USER }}
          VM_HOST: ${{ secrets.FREE_VM_HOST }}
          VM_PORT: ${{ secrets.FREE_VM_PORT }}
        run: |
          PORT="${VM_PORT:-22}"

          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -i ~/.ssh/free-vm \
              -p "$PORT" \
              "$VM_USER@$VM_HOST" \
              "echo SSH login works"

      - name: Upload files to temp directory
        env:
          VM_USER: ${{ secrets.FREE_VM_USER }}
          VM_HOST: ${{ secrets.FREE_VM_HOST }}
          VM_PORT: ${{ secrets.FREE_VM_PORT }}
        run: |
          PORT="${VM_PORT:-22}"

          rsync -av --delete --partial --inplace \
            -e "ssh -i ~/.ssh/free-vm -p $PORT -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes" \
            public/ \
            "$VM_USER@$VM_HOST:/tmp/hugo-deploy/"

      - name: Deploy static files directly to free-vm cloud /var/www/html/stashed
        env:
          VM_USER: ${{ secrets.FREE_VM_USER }}
          VM_HOST: ${{ secrets.FREE_VM_HOST }}
          VM_PORT: ${{ secrets.FREE_VM_PORT }}
        run: |
          PORT="${VM_PORT:-22}"

          echo "Initiating direct sync to /var/www/html/stashed..."

          rsync -av --delete --partial --inplace \
            -e "ssh -i ~/.ssh/free-vm -p $PORT -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes" \
            public/ \
            "$VM_USER@$VM_HOST:/var/www/html/stashed/"