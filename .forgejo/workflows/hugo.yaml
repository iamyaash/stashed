name: Build and Deploy Hugo site

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: tiny-machine
    container:
      image: docker.io/hugomods/hugo:0.147.5
    defaults:
      run:
        shell: sh

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Node.js dependencies
        run: |
          if [ -f package.json ]; then
            apk add --no-cache nodejs npm
            if [ -f package-lock.json ] || [ -f npm-s
            
            hrinkwrap.json ]; then
            
              npm ci
            else
              npm install
            fi
          fi

      - name: Build Static Files
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo --gc --minify

      - name: Save Site Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: static-site-files
          path: public/
  
  deploy:
    runs-on: tiny-machine
    needs: build
    container:
      image: docker.io/library/node:lts
    defaults:
      run:
        shell: bash

    steps:
      - name: Download Site Artifacts
        uses: actions/download-artifact@v3
        with:
          name: static-site-files
          path: public/

      - name: Verify downloaded files
        run: |
          ls -la
          ls -la public

      - name: Install rsync and ssh client
        run: |
          apt-get update
          apt-get install -y rsync openssh-client

      - name: Prepare SSH
        env:
          VM_HOST: ${{ secrets.FREE_VM_HOST }}
          VM_PORT: ${{ secrets.FREE_VM_PORT }}
          VM_KEY: ${{ secrets.FREE_VM_SSH }}
        run: |
          set -eux
          PORT="${VM_PORT:-22}"
          mkdir -p /root/.ssh
          chmod 700 /root/.ssh
          printf '%s\n' "$VM_KEY" | tr -d '\r' > /root/.ssh/free-vm
          chmod 600 /root/.ssh/free-vm
          : > /root/.ssh/known_hosts
          chmod 644 /root/.ssh/known_hosts
          ssh-keyscan -H -p "$PORT" "$VM_HOST" >> /root/.ssh/known_hosts
          test -s /root/.ssh/free-vm
          test -s /root/.ssh/known_hosts

      - name: Test SSH connection
        env:
          VM_USER: ${{ secrets.FREE_VM_USER }}
          VM_HOST: ${{ secrets.FREE_VM_HOST }}
          VM_PORT: ${{ secrets.FREE_VM_PORT }}
        run: |
          set -eux
          PORT="${VM_PORT:-22}"
          ssh -vvv \
            -o BatchMode=yes \
            -o UserKnownHostsFile=/root/.ssh/known_hosts \
            -o StrictHostKeyChecking=yes \
            -i /root/.ssh/free-vm \
            -p "$PORT" \
            "$VM_USER@$VM_HOST" \
            "echo SSH login works"

      - name: Upload files to temp directory
        env:
          VM_USER: ${{ secrets.FREE_VM_USER }}
          VM_HOST: ${{ secrets.FREE_VM_HOST }}
          VM_PORT: ${{ secrets.FREE_VM_PORT }}
        run: |
          set -eux
          PORT="${VM_PORT:-22}"
          /usr/bin/rsync -av --delete --partial --inplace \
            --rsync-path=/usr/bin/rsync \
            -e "ssh -i ~/.ssh/free-vm -p $PORT -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes" \
            public/ \
            "$VM_USER@$VM_HOST:/tmp/hugo-deploy/"

      - name: Prepare remote web directory
        env:
          VM_USER: ${{ secrets.FREE_VM_USER }}
          VM_HOST: ${{ secrets.FREE_VM_HOST }}
          VM_PORT: ${{ secrets.FREE_VM_PORT }}
        run: |
          set -eux
          PORT="${VM_PORT:-22}"
          ssh -i ~/.ssh/free-vm -p "$PORT" \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            'mkdir -p /var/www/html/stashed'

      - name: Deploy static files directly to free-vm cloud /var/www/html/stashed
        env:
          VM_USER: ${{ secrets.FREE_VM_USER }}
          VM_HOST: ${{ secrets.FREE_VM_HOST }}
          VM_PORT: ${{ secrets.FREE_VM_PORT }}
        run: |
          set -eux
          PORT="${VM_PORT:-22}"
          /usr/bin/rsync -av --delete --partial --inplace \
            --rsync-path="sudo /usr/bin/rsync" \
            -e "ssh -i /root/.ssh/free-vm -p $PORT -o UserKnownHostsFile=/root/.ssh/known_hosts -o StrictHostKeyChecking=yes" \
            public/ \
            "$VM_USER@$VM_HOST:/var/www/html/stashed/"